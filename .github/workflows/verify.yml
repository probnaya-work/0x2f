name: Verify release candidate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 24, 26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build:client
      - name: Install the packed artifact
        shell: bash
        run: |
          archive=$(npm pack --silent)
          npm install --global --prefix "$RUNNER_TEMP/0x2f-prefix" "$PWD/$archive" --ignore-scripts
          "$RUNNER_TEMP/0x2f-prefix/bin/2f" version
          "$RUNNER_TEMP/0x2f-prefix/bin/2f" --help

  hosted-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify the actual Caddy deployment
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/caddyserver/caddy/releases/download/v2.10.2/caddy_2.10.2_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/caddy.tar.gz"
          echo "747df7ee74de188485157a383633a1a963fd9233b71fbb4a69ddcbcc589ce4e2cc82dacf5dbbe136cb51d17e14c59daeb5d9bc92487610b0f3b93680b2646546  $RUNNER_TEMP/caddy.tar.gz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/caddy.tar.gz" -C "$RUNNER_TEMP" caddy
          CADDY_BIN="$RUNNER_TEMP/caddy" node --test test/hosted-deployment.test.mjs
